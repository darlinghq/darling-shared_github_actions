name: Darling Submodule Full Regression
description: A shared action for running a full regression build of Darling against an updated submodule

inputs:
  submodule-path:
    description: Path to the submodule in the darling project
    required: true

runs:
  using: composite
  steps:
    - name: Checkout Darling
      uses: actions/checkout@v7
      with:
        repository: darlinghq/darling
        submodules: recursive
    
    - name: Delete '${{ inputs.submodule-path }}' submodule
      run: |
        rm -rf ${{ inputs.submodule-path }}
    
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        path: ${{ inputs.submodule-path }}
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install devscripts equivs debhelper
        sudo mk-build-deps -i -r -t "apt-get --no-install-recommends -y" debian/control

    # see https://github.com/actions/virtual-environments/issues/2606#issuecomment-772683150
    - name: Free up space
      run: |
        sudo rm -rf /usr/share/dotnet

    - name: Build DEBs
      run: |
        ./tools/debian/make-deb

    - name: Move DEBs
      run: |
        mkdir dist && mv ../*.deb dist

    - name: Upload artifacts
      uses: actions/upload-artifact@v4.1.0
      with:
        name: 'debs'
        path: dist/
