name: Darling Submodule Full Regression
description: A shared action for running a full regression build of Darling against an updated submodule

inputs:
  submodule-path:
    description: Path to the submodule in the darling project
    required: true

runs:
  using: composite
  steps:
    - name: Checkout Darling
      uses: actions/checkout@v7
      with:
        repository: darlinghq/darling

    # Fetch the submodules with plain git, as darling's own workflow does: it
    # runs in parallel, and Git LFS files (such as darling-swift's runtime
    # dylibs) are downloaded instead of being left as pointer files.
    - name: Checkout submodules
      run: git submodule update --init --recursive --depth 1 --jobs 8
      shell: bash
    
    - name: Delete '${{ inputs.submodule-path }}' submodule
      run: |
        rm -rv ${{ inputs.submodule-path }}
      shell: bash
    
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        path: ${{ inputs.submodule-path }}
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install devscripts equivs debhelper
        sudo mk-build-deps -i -r -t "apt-get --no-install-recommends -y" debian/control
      shell: bash

    # see https://github.com/actions/virtual-environments/issues/2606#issuecomment-772683150
    - name: Free up space
      run: |
        sudo rm -rf /usr/share/dotnet
      shell: bash

    - name: Build DEBs
      run: |
        ./tools/debian/make-deb
      shell: bash

    - name: Move DEBs
      run: |
        mkdir dist && mv ../*.deb dist
      shell: bash

    - name: Upload artifacts
      uses: actions/upload-artifact@v4.1.0
      with:
        name: 'debs'
        path: dist/
